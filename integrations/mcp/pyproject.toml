[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fantasy-workflow-mcp"
version = "0.3.0"
description = "Local MCP adapter for Fantasy private and community creative workspaces"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0", "httpx==0.28.1", "truststore>=0.10,<1"]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
fantasy-mcp = "fantasy_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

